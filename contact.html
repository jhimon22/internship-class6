<!DOCTYPE html>
<html>
    <head><title>contact us</title></head>
    <body>
        <h1>contact with us</h1>
        <p>plz fill up the form,we contact with u in 24 hours</p>

        <form action="/contact"  method="POST">
            <fieldset>
                <legend>your information</legend>
                <p>
                    <label for="name">full name</label><br />
                    <input type="text" id="name" name="name" required minlength="3" placeholder="jon cina"  />
                </p>
                <p>
                    <label for="email">Email</label><br />
                    <input type="email" id="email" name="email"required placeholder="You@example.com" />
                </p>
                <p>
                    <label for="phone">phone</label><br  />
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{11}"placeholder="01700000000" />


                </p>
            </fieldset>
            <fieldset>
                <legend>info</legend>


                <p>
                    <label for="subject">subject</label><br  />
                    <select name="subject" id="subject"required>
                        <option value="">--find it--</option>
                        <option value="general">general question</option>
                        <option value="support">technical support</option>
                        <option value="feedback">feedback</option>
                        
                    </select>

                </p>
                <p>
                    <label for="msg">ur info</label><br />
                    <textarea id="msg" name="msg" rows="5" cols="40"required minlength="10"></textarea>

                </p>
            </fieldset>
            <button type="submit">send</button>
            <button type="reset">clear</button>
        </form>


    </body>
</html>
